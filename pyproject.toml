[project]
name = "gtm-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "spspartha", email = "spspartha@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=1.15.28",
    "httpx>=0.28.1",
    "langchain-core>=1.6.12",
    "mcp>=1.28.1",
    "numpy<2.3",
]

[project.scripts]
gtm-agent-system = "gtm_agent_system:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

